            <section id="main" class="container">
                <header>
                    <h2>Kalorienrechner</h2>
                    <p>Tracke deine tägliche Kalorienaufnahme.</p>
                </header>
                <div class="box">
                    <form id="entry-form">
                        <div class="row gtr-uniform gtr-50">
                            <div class="col-4 col-12-xsmall">
                                <input type="date" name="date" id="date" required />
                            </div>
                            <div class="col-4 col-12-xsmall">
                                <input type="text" name="meal" id="meal" placeholder="Mahlzeit" required />
                            </div>
                            <div class="col-4 col-12-xsmall">
                                <input type="number" name="calories" id="calories" placeholder="Kalorien" required />
                            </div>
                            <div class="col-12">
                                <ul class="actions">
                                    <li><input type="submit" value="Speichern" class="primary" /></li>
                                </ul>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="box">
                    <h3>Einträge</h3>
                    <table id="entries-table">
                        <thead>
                            <tr><th>Datum</th><th>Mahlzeit</th><th>Kalorien</th><th></th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
